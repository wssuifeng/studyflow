name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './packages/core[dev]'
      - run: python scripts/check_publish_boundary.py --tracked
      - run: python -m pytest packages/core/tests
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run test:learning
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop

  browser-closed-loop:
    name: browser-closed-loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -e './packages/core[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - run: python apps/desktop/scripts/smoke-iteration.py
  windows-engine-regression:
    name: windows-engine-regression
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m venv packages/core/.venv
      - run: packages/core/.venv/Scripts/python -m pip install -e './packages/core[dev]' pyinstaller
      - run: ./apps/desktop/scripts/build-engine.ps1
        shell: pwsh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci; npm run build
        working-directory: apps/desktop
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --lib
