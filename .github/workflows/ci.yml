name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run theme:lint
        working-directory: apps/desktop
      - run: npm run test:learning
        working-directory: apps/desktop
      - run: npm run test:themes && npm run test:english
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop

  windows-rust-core:
    name: windows-rust-core
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python -X utf8 scripts/check_publish_boundary.py --tracked
      - run: cargo metadata --locked --no-deps --format-version 1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p studyflow-core -p studyflow-runtime
  windows-rust-desktop:
    name: windows-rust-desktop
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.62.0 psutil==7.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri -- build --no-bundle
        working-directory: apps/desktop
      - run: cargo test --locked -p studyflow-desktop --release --lib
      - name: Test the native release with synthetic data
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'studyflow-smoke-workspace'
          $evidence = Join-Path $env:RUNNER_TEMP 'studyflow-smoke-evidence'
          $cargo = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktop = Join-Path $cargo.target_directory 'release/studyflow-desktop.exe'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          pwsh -NoProfile -File ./apps/desktop/scripts/verify-rust-desktop.ps1 -Mode BuildTree -DesktopPath $desktop -WorkspacePath $fixture -EvidencePath $evidence -ExerciseBusinessFlows
          $result = $LASTEXITCODE
          Get-ChildItem -LiteralPath $evidence -Filter '*.log' | ForEach-Object { Get-Content -LiteralPath $_.FullName }
          exit $result

  rust-backend-required:
    # Keep the existing required GitHub check name after retiring the Python runtime.
    name: python-tests
    needs: [windows-rust-core, windows-rust-desktop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require passing Rust Core and desktop checks
        env:
          CORE_RESULT: ${{ needs.windows-rust-core.result }}
          DESKTOP_RESULT: ${{ needs.windows-rust-desktop.result }}
        run: test "$CORE_RESULT" = success && test "$DESKTOP_RESULT" = success
