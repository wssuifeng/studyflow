[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow-local"
version = "1.7.0"
description = "Local Web UI and CLI learning workbench for a single learner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "markdown>=3.7,<4",
  "PyYAML>=6.0.2,<7",
  "bleach>=6.2,<7",
  "pydantic-settings>=2.6,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "pytest-cov>=5,<6"]

[project.scripts]
studyflow = "studyflow.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["studyflow*"]
namespaces = false

[tool.setuptools.package-data]
studyflow = [
  "resources/alembic.ini",
  "resources/migrations/*.md", "resources/migrations/*.py", "resources/migrations/*.mako",
  "resources/migrations/versions/*.py",
  "resources/templates/*.html", "resources/static/*.css",
  "resources/content/lessons/java-reference.md"
]
