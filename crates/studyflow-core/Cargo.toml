[package]
name = "studyflow-core"
version.workspace = true
edition.workspace = true

[dependencies]
ammonia = "4.1"
base64 = "0.22"
csv = "1.4"
dunce = "1"
html5ever = "0.40"
icu_casemap = "2.3"
icu_normalizer = "2.3"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["backup", "bundled"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
